---
layout: default
---
<div class="container">
  <div class="page-head">
    {% if page.eyebrow %}<div class="eyebrow">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p>{{ page.description | strip_newlines }}</p>{% endif %}
  </div>
</div>

<main class="container">
  <div class="page-content">
    {{ content }}
  </div>
</main>
