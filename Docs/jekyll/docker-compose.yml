# Live-reload dev server for the Jekyll docs.
#   docker compose -f Docs/jekyll/docker-compose.yml up   → http://localhost:4000
#
# The source is mounted in, so edits to Markdown/layouts rebuild on the fly.
services:
  docs:
    build:
      context: .
      target: build
    ports:
      - "4000:4000"
    volumes:
      - .:/site
      # Keep the container's installed gems from being shadowed by the mount.
      - /site/vendor
    command: >
      bundle exec jekyll serve
      --host 0.0.0.0
      --livereload
      --force_polling
