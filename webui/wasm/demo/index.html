<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HttpStackLens — composer (Go/WASM components)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root, [data-theme="light"] {
    --desk:#e9e5de; --panel:#ffffff; --sidebar:#faf8f4;
    --bg0:#f1eee8; --bg2:#f6f3ee; --bg3:#eae5db;
    --line:#e5e0d6; --lineSoft:#efebe3;
    --ink:#2b2926; --dim:#6f6b62; --faint:#a49f94;
    --mint:#2f9e8f; --warn:#c98a2b; --danger:#d1584f; --info:#4a7fc4; --pink:#9a6cc9;
    --scroll-thumb:#d8d2c6; --scroll-thumb-hover:#c7c0b2;
  }
  [data-theme="dark"] {
    --desk:#0a0b0d; --panel:#15171c; --sidebar:#15171c;
    --bg0:#0e0f12; --bg2:#1c1f26; --bg3:#23272f;
    --line:#262a33; --lineSoft:#1f232a;
    --ink:#d8dce4; --dim:#8a93a3; --faint:#5a6173;
    --mint:#7fd4b4; --warn:#f1b45a; --danger:#e86a6a; --info:#7aa7ff; --pink:#d48ad6;
    --scroll-thumb:#23272f; --scroll-thumb-hover:#2f343d;
  }
  html, body { margin:0; height:100%; background:var(--desk); overflow:hidden }
  body { font-family:Inter, system-ui, sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;
         display:flex; flex-direction:column }
  button, input, select, textarea { font-family:inherit }
  .bar { display:flex; align-items:center; gap:10px; height:46px; padding:0 14px; flex-shrink:0;
         background:var(--panel); border-bottom:1px solid var(--line) }
  .bar b { font-size:13.5px }
  .bar span { font-size:11.5px; color:var(--dim) }
  .bar .grow { flex:1 }
  .bar button { background:var(--bg2); border:1px solid var(--line); border-radius:6px; color:var(--dim);
                font-size:11.5px; padding:4px 10px; cursor:pointer }
  #app { flex:1; min-height:0; display:flex; background:var(--bg0) }
  #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            background:var(--desk); font-size:12.5px; color:var(--dim); z-index:99 }
  #loader[hidden] { display:none }
</style>
</head>
<body>

<div id="loader">Loading WASM…</div>

<div class="bar">
  <b>HttpStackLens</b>
  <span>composer — three Go components, no application JS</span>
  <span class="grow"></span>
  <button onclick="toggleTheme()">Theme</button>
</div>

<div id="app"></div>

<script src="wasm_exec.js"></script>
<script>
  function toggleTheme() {
    const el = document.documentElement;
    el.dataset.theme = el.dataset.theme === 'dark' ? 'light' : 'dark';
  }
  document.documentElement.dataset.theme = 'light';

  const go = new Go();
  WebAssembly.instantiateStreaming(fetch('demo.wasm'), go.importObject)
    .then((r) => go.run(r.instance));
</script>

</body>
</html>
