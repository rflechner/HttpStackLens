<span class="mp-title">Calls</span>
<div class="mp-search">
  <svg width="13" height="13" viewBox="0 0 14 14" fill="none" aria-hidden="true">
    <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.4"></circle>
    <path d="M9.5 9.5L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
  </svg>
  <input placeholder="Filter by tool, method, status, client…" value="{{.Filter}}" data-on-input="FilterChanged" />
</div>
<label class="mp-check inline">
  <input type="checkbox" data-on-change="ToggleErrors" {{if .ErrorsOnly}}{{attr "checked"}}{{end}} />
  <span>Errors only</span>
</label>
<span class="mp-grow"></span>
<button class="mp-mini" data-on-click="Clear" title="Empty the trace, here and in every open window">Clear</button>
