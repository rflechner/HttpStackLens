name: Release

on:
  push:
    tags:
      - "v*"
    # TEMPORARY — lets this workflow be exercised before it reaches the default
    # branch (workflow_dispatch only shows up once the file is on main). The
    # `release` job is guarded below, so a branch push builds and tests without
    # publishing anything. Delete this `branches:` block once merged to main.
    branches:
      - "develop"
      - "main"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v0.1.2-alpha). Produces a draft release."
        required: true
      package_macos:
        description: "Build, test and package macOS (amd64 and arm64) alongside Windows."
        type: boolean
        default: false

permissions:
  contents: write

env:
  APP_NAME: httpStackLens
  # Shipped as config.yaml in every archive — never the repo's own config.yaml,
  # which may carry local tweaks that must not leak into a release.
  SAMPLE_CONFIG: .github/config.sample.yaml

jobs:
  # Resolves the version once so every downstream job stamps the same values,
  # and fails the run early on a missing/broken sample config.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      date: ${{ steps.version.outputs.date }}
      matrix: ${{ steps.targets.outputs.matrix }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            # branch push: a dry run. Never published, and the branch name would
            # otherwise put a "/" into every archive filename.
            version="v0.0.0-dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Select build targets
        id: targets
        env:
          # Tag and branch pushes have no manual input: Windows only.
          PACKAGE_MACOS: ${{ inputs.package_macos || false }}
        run: |
          python3 - <<'PY'
          import json
          import os

          # Windows builds are pure Go; the macOS backend requires cgo.
          platforms = [("windows-latest", "windows", "HttpStackLens.exe", "httpStackLens.exe", "0")]
          if os.environ["PACKAGE_MACOS"] == "true":
              platforms.append(("macos-latest", "darwin", "HttpStackLens.app", "HttpStackLens.app", "1"))

          targets = []
          for runner, goos, source, artifact, cgo in platforms:
              for arch in ("amd64", "arm64"):
                  targets.append(dict(os=runner, goos=goos, arch=arch,
                                      source=f"build/bin/{source}", artifact=artifact, cgo=cgo))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps({"include": targets}) + "\n")
              output.write("targets=" + " ".join(f"{t['goos']}_{t['arch']}" for t in targets) + "\n")
          PY

      - name: Check sample config
        run: |
          set -eu
          test -f "${SAMPLE_CONFIG}" || {
            echo "::error::${SAMPLE_CONFIG} is missing — releases ship it as config.yaml"
            exit 1
          }
          # syntax check only — ruby ships with the runner image, PyYAML does not
          ruby -ryaml -e 'YAML.safe_load(File.read(ARGV[0]))' "${SAMPLE_CONFIG}"

  # Built once and shared: the WASM + CSS output is platform-independent and gets
  # embedded into every binary via //go:embed, so rebuilding it per platform would
  # just be a second npm install for an identical result.
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Build Web UI (WASM + Tailwind CSS)
        run: go run ./build-tools/main.go webui

      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/wwwroot
          retention-days: 1

  build:
    needs: [prepare, webui]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # bash everywhere, so the matrix runs one script instead of two dialects
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/wwwroot

      # Native runners are the point of the matrix: this is what finally exercises
      # the windows-only files (security/, sspi auth, cert_cleanup_windows_test.go)
      # and the darwin-only keychain code.
      - name: Run tests
        run: go test ./...

      - name: Build binaries
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -eu
          # The macOS runner is arm64, so darwin/amd64 is a cgo cross-compile.
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            if [ "${{ matrix.arch }}" = "amd64" ]; then clang_arch="x86_64"; else clang_arch="arm64"; fi
            export CGO_CFLAGS="-arch ${clang_arch}"
            export CGO_LDFLAGS="-arch ${clang_arch}"
          fi

          go run ./build-tools/main.go \
            -platform "${{ matrix.goos }}/${{ matrix.arch }}" \
            -skip-frontend \
            -version "${{ needs.prepare.outputs.version }}" \
            -commit "${{ needs.prepare.outputs.commit }}" \
            -date "${{ needs.prepare.outputs.date }}" \
            app

          out="dist/${{ matrix.goos }}_${{ matrix.arch }}/${{ matrix.artifact }}"
          mkdir -p "$(dirname "$out")"
          cp -R "${{ matrix.source }}" "$out"

      # No codesign step for darwin: with cgo the external linker (clang/ld)
      # is used, and it applies the same ad-hoc signature to arm64 Mach-O
      # output (flags=adhoc,linker-signed) that Apple Silicon requires. amd64
      # needs no signature at all. Notarization would be a different matter —
      # it needs a Developer ID and is not set up here.

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist
          retention-days: 1

  package:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist
          merge-multiple: true

      - name: Package archives
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
        run: |
          set -eu
          version="${{ needs.prepare.outputs.version }}"
          mkdir -p artifacts

          # Package only the targets selected and built by the matrix.
          for target in ${TARGETS}; do
            cp "${SAMPLE_CONFIG}" "dist/${target}/config.yaml"
            cp readme.md readme.fr.md LICENSE RELEASE.md "dist/${target}/"
            # upload-artifact does not preserve the Unix executable bit
            chmod +x "dist/${target}/${APP_NAME}" 2>/dev/null || true
            find "dist/${target}" -type f -path '*/Contents/MacOS/*' -exec chmod +x {} +
            (cd "dist/${target}" && zip -qr "../../artifacts/${APP_NAME}_${version}_${target}.zip" .)
          done

          (cd artifacts && sha256sum *.zip > "checksums_${version}.txt")
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: httpstacklens-${{ needs.prepare.outputs.version }}
          path: artifacts/*

  release:
    needs: [prepare, package]
    # Only a tag push or a manual dispatch publishes. A branch push stops after
    # `package`, so the whole pipeline — including the archives — can be tested
    # without creating a release.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: httpstacklens-${{ needs.prepare.outputs.version }}
          path: artifacts

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="${{ needs.prepare.outputs.version }}"
          prerelease=""
          case "$version" in *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;; esac
          draft=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then draft="--draft"; fi

          # --repo is required: this job has no checkout, so gh can't infer the
          # repository from a local git remote.
          gh release create "$version" artifacts/* \
            --repo "${{ github.repository }}" \
            --title "$version" \
            --generate-notes \
            $prerelease $draft
